name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quality gate (scripts/check.sh)
        shell: bash
        env:
          # The shared gate is the only list of checks; CI only asks it to emit
          # coverage.xml as well so the artefact below can be uploaded.
          COVERAGE_XML: "1"
        run: bash scripts/check.sh

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  example:
    name: Wheel package & CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/*.whl
      - name: Rebuild the synthetic example
        run: python scripts/make_example.py
      - name: Smoke-test installed wheel outside the source tree
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          cp examples/fake_financial_model.xlsx "$workdir/fake_financial_model.xlsx"
          python - "$workdir/clean.xlsx" <<'PY'
          import sys
          from pathlib import Path
          from tests.factory import build_workbook, simple_sheet
          build_workbook(
              Path(sys.argv[1]),
              [simple_sheet("Sheet1", {"A1": {"v": 1}, "A2": {"f": "A1+1", "v": 2}})],
          )
          PY
          cd "$workdir"
          python - <<'PY'
          from pathlib import Path
          import xlsx_audit
          pkg_dir = Path(xlsx_audit.__file__).resolve().parent
          assert "site-packages" in pkg_dir.parts, pkg_dir
          assert (pkg_dir / "py.typed").is_file(), pkg_dir
          PY
          set +e
          xlsx-audit check fake_financial_model.xlsx --format json -o report.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          report = json.load(open("report.json", encoding="utf-8"))
          codes = report["summary"]["by_code"]
          expected = {
              "BROKEN_REFERENCE": 1,
              "EXTERNAL_LINK": 1,
              "MAGIC_NUMBER_IN_FORMULA": 1,
              "OMITTED_CELL_WARNING": 1,
              "VERY_HIDDEN_SHEET": 1,
          }
          assert codes == expected, (codes, expected)
          assert report["status"] == "fail"
          print("example report matches the documented findings")
          PY
          xlsx-audit check clean.xlsx
